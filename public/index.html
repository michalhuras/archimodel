<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Project</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <h1>Private content</h1>
  <p>This page is protected.</p>

  <h2>Apartments</h2>
  <div id="apartments">Loading...</div>

  <h2>3D model</h2>
  <div id="model-viewer" style="width: 100%; max-width: 1100px; height: 520px; border: 1px solid #ddd; position: relative; overflow: hidden;"></div>

  <div id="plain-angle-controls" style="width: 100%; max-width: 1100px; border: 1px solid #ddd; border-top: 0; padding: 10px 12px; box-sizing: border-box; display: flex; align-items: center; gap: 12px;">
    <button id="plain-angle-left" type="button">&larr;</button>
    <div style="min-width: 90px; text-align: center; font-weight: 600;" id="plain-angle-value">0°</div>
    <button id="plain-angle-right" type="button">&rarr;</button>
  </div>

  <button onclick="logout()">Logout</button>

  <script>
    if (localStorage.getItem("auth") !== "ok") {
      window.location.href = "/login.html"
    }

    function normalizeLayerName(s) {
      return String(s || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "_")
    }

    window.__highlightApartmentsByLayer = function (layerName) {
      const key = normalizeLayerName(layerName)
      const rows = document.querySelectorAll("#apartments table tr[data-layer]")
      for (const r of rows) {
        const match = key && r.dataset.layer === key
        r.style.background = match ? "rgba(99, 102, 241, 0.18)" : ""
        r.style.outline = match ? "2px solid rgba(99, 102, 241, 0.45)" : ""
      }
    }

    async function loadApartments() {
      const el = document.getElementById("apartments")

      try {
        const res = await fetch("/.netlify/functions/apartment")
        if (!res.ok) throw new Error("Request failed")
        const apartments = await res.json()

        if (!Array.isArray(apartments) || apartments.length === 0) {
          el.textContent = "No apartments"
          return
        }

        const table = document.createElement("table")
        const header = document.createElement("tr")
        header.innerHTML = "<th>Name</th><th>Price</th><th>Price/m²</th><th>Area</th><th>Floor</th><th>State</th><th>Layer</th>"
        table.appendChild(header)

        for (const a of apartments) {
          const row = document.createElement("tr")
          const layer = normalizeLayerName(a.layer_name)
          if (layer) row.dataset.layer = layer

          row.innerHTML = `<td>${a.name ?? ""}</td><td>${a.price ?? ""}</td><td>${a.price_per_square_metre ?? ""}</td><td>${a.area ?? ""}</td><td>${a.floor ?? ""}</td><td>${a.state ?? ""}</td><td>${a.layer_name ?? ""}</td>`
          table.appendChild(row)
        }

        el.textContent = ""
        el.appendChild(table)
      } catch (e) {
        el.textContent = "Failed to load apartments"
      }
    }

    function logout() {
      localStorage.removeItem("auth")
      window.location.href = "/login.html"
    }

    loadApartments()
  </script>

  <script type="module">
    import * as THREE from "three"
    import { OrbitControls } from "three/addons/controls/OrbitControls.js"
    import { OBJLoader } from "three/addons/loaders/OBJLoader.js"

    // --- 3D viewer ---
    const plainContainer = document.getElementById("model-viewer")
    if (!plainContainer) throw new Error("Missing #model-viewer")

    const layerButtonsOverlay = document.createElement("div")
    layerButtonsOverlay.style.position = "absolute"
    layerButtonsOverlay.style.left = "0"
    layerButtonsOverlay.style.top = "0"
    layerButtonsOverlay.style.width = "100%"
    layerButtonsOverlay.style.height = "100%"
    layerButtonsOverlay.style.pointerEvents = "none"
    plainContainer.appendChild(layerButtonsOverlay)

    const layerShapesSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg")
    layerShapesSvg.setAttribute("width", "100%")
    layerShapesSvg.setAttribute("height", "100%")
    layerShapesSvg.setAttribute("preserveAspectRatio", "none")
    layerShapesSvg.style.position = "absolute"
    layerShapesSvg.style.left = "0"
    layerShapesSvg.style.top = "0"
    layerShapesSvg.style.pointerEvents = "none"
    layerButtonsOverlay.appendChild(layerShapesSvg)

    const plainScene = new THREE.Scene()
    plainScene.background = new THREE.Color(0xf7f7f7)

    const plainCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000)
    plainCamera.position.set(3, 2, 3)

    const plainRenderer = new THREE.WebGLRenderer({ antialias: true })
    plainRenderer.setPixelRatio(window.devicePixelRatio || 1)
    plainContainer.appendChild(plainRenderer.domElement)

    const plainControls = new OrbitControls(plainCamera, plainRenderer.domElement)
    plainControls.enableDamping = true
    // Disable manual interaction; camera moves only via buttons.
    plainControls.enabled = false
    plainControls.enableRotate = false
    plainControls.enablePan = false
    plainControls.enableZoom = false

    const plainAngleLeftBtn = document.getElementById("plain-angle-left")
    const plainAngleRightBtn = document.getElementById("plain-angle-right")
    const plainAngleValueEl = document.getElementById("plain-angle-value")

    let plainAngleDeg = 0
    let plainTarget = new THREE.Vector3(0, 0, 0)
    let plainBaseOffset = new THREE.Vector3(1, 1, 1)

    let layerButtonEntries = []

    let updateLayerButtonsPositions = () => {}

    function normalizeAngle(deg) {
      const n = ((deg % 360) + 360) % 360
      return n
    }

    function setPlainAngle(deg) {
      plainAngleDeg = normalizeAngle(deg)
      if (plainAngleValueEl) plainAngleValueEl.textContent = `${plainAngleDeg}°`

      const rad = (plainAngleDeg * Math.PI) / 180
      const offset = plainBaseOffset.clone()
      offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), rad)

      plainCamera.position.copy(plainTarget).add(offset)
      plainControls.target.copy(plainTarget)
      plainCamera.lookAt(plainTarget)
      plainCamera.updateProjectionMatrix()

      updateLayerButtonsPositions()
    }

    if (plainAngleLeftBtn) {
      plainAngleLeftBtn.onclick = () => setPlainAngle(plainAngleDeg - 45)
    }
    if (plainAngleRightBtn) {
      plainAngleRightBtn.onclick = () => setPlainAngle(plainAngleDeg + 45)
    }

    plainScene.add(new THREE.AmbientLight(0xffffff, 0.7))
    const plainDir = new THREE.DirectionalLight(0xffffff, 0.7)
    plainDir.position.set(5, 10, 7)
    plainScene.add(plainDir)

    plainScene.add(new THREE.GridHelper(10, 10, 0x999999, 0xdddddd))
    plainScene.add(new THREE.AxesHelper(2))

    function resizePlain() {
      const w = plainContainer.clientWidth || 800
      const h = plainContainer.clientHeight || 500
      plainRenderer.setSize(w, h, false)
      plainCamera.aspect = w / h
      plainCamera.updateProjectionMatrix()
    }
    window.addEventListener("resize", resizePlain)
    resizePlain()

    async function loadObjForPlainViewer() {
      const res = await fetch("/.netlify/functions/model-obj")
      if (!res.ok) throw new Error("OBJ endpoint failed")
      const objText = await res.text()

      const loader = new OBJLoader()
      const obj = loader.parse(objText)

      async function fetchApartments() {
        try {
          const aRes = await fetch("/.netlify/functions/apartment")
          if (!aRes.ok) return []
          const data = await aRes.json()
          return Array.isArray(data) ? data : []
        } catch {
          return []
        }
      }

      function normalizeName(s) {
        return String(s || "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, "_")
      }

      function colorForState(state) {
        const st = String(state || "").toLowerCase()
        if (st === "selling") return "#86efac" // pastel green
        if (st === "sold") return "#fca5a5" // pastel red
        if (st === "reserved") return "#fdba74" // pastel orange
        return null
      }

      function applyColorToMesh(mesh, hex) {
        if (!mesh || !mesh.isMesh || !hex) return
        const mat = mesh.material
        if (Array.isArray(mat)) {
          for (const m of mat) {
            if (!m) continue
            if (m.color) m.color.set(hex)
            m.transparent = true
            m.opacity = 0.55
            m.depthWrite = false
          }
        } else if (mat && mat.color) {
          mat.color.set(hex)
          mat.transparent = true
          mat.opacity = 0.55
          mat.depthWrite = false
        }
      }

      // Colorize layers/groups based on apartments JSON
      const apartments = await fetchApartments()
      const layerToColor = new Map()
      for (const a of apartments) {
        const layer = normalizeName(a.layer_name)
        const col = colorForState(a.state)
        if (!layer || !col) continue
        layerToColor.set(layer, col)
      }

      function findLayerNodes(root, layerName) {
        const matches = []
        root.traverse((node) => {
          const nName = normalizeName(node.name)
          if (!nName) return
          if (nName === layerName || nName.includes(layerName)) {
            matches.push(node)
          }
        })
        // prefer higher-level nodes (avoid duplicates where both parent and child match)
        const filtered = []
        for (const n of matches) {
          let parent = n.parent
          let coveredByParent = false
          while (parent) {
            if (matches.includes(parent)) {
              coveredByParent = true
              break
            }
            parent = parent.parent
          }
          if (!coveredByParent) filtered.push(n)
        }
        return filtered.length ? filtered : matches
      }

      function clearLayerButtons() {
        layerShapesSvg.textContent = ""
        layerButtonEntries = []
      }

      function createLayerButtons(root) {
        clearLayerButtons()
        if (layerToColor.size === 0) return

        for (const [layerName, hex] of layerToColor.entries()) {
          const nodes = findLayerNodes(root, layerName)
          if (!nodes.length) continue

          // one shape per layer name; if multiple nodes match, toggle them all
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path")
          path.setAttribute("fill", hex)
          path.setAttribute("fill-opacity", "0.55")
          path.setAttribute("stroke", hex)
          path.setAttribute("stroke-opacity", "0.9")
          path.setAttribute("stroke-width", "2")
          path.style.cursor = "pointer"
          path.style.pointerEvents = "auto"

          path.addEventListener("click", () => {
            const anyVisible = nodes.some((n) => n.visible !== false)
            const next = !anyVisible
            for (const n of nodes) n.visible = next

            if (typeof window.__highlightApartmentsByLayer === "function") {
              window.__highlightApartmentsByLayer(layerName)
            }
          })

          layerShapesSvg.appendChild(path)
          layerButtonEntries.push({ layerName, nodes, path })
        }
      }

      function convexHull(points) {
        if (points.length <= 2) return points

        const pts = points
          .map((p) => ({ x: p.x, y: p.y }))
          .sort((a, b) => (a.x === b.x ? a.y - b.y : a.x - b.x))

        const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x)

        const lower = []
        for (const p of pts) {
          while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) {
            lower.pop()
          }
          lower.push(p)
        }

        const upper = []
        for (let i = pts.length - 1; i >= 0; i--) {
          const p = pts[i]
          while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) {
            upper.pop()
          }
          upper.push(p)
        }

        upper.pop()
        lower.pop()
        return lower.concat(upper)
      }

      function pathFromHull(hull) {
        if (!hull || hull.length === 0) return ""
        if (hull.length === 1) {
          const p = hull[0]
          return `M ${p.x} ${p.y} m -6 0 a 6 6 0 1 0 12 0 a 6 6 0 1 0 -12 0`
        }
        let d = `M ${hull[0].x} ${hull[0].y}`
        for (let i = 1; i < hull.length; i++) {
          d += ` L ${hull[i].x} ${hull[i].y}`
        }
        d += " Z"
        return d
      }

      function projectLayerPoints(nodes, w, h) {
        const pts = []

        for (const node of nodes) {
          node.traverse((desc) => {
            if (!desc || !desc.isMesh || !desc.geometry) return
            const geo = desc.geometry
            const pos = geo.attributes?.position
            if (!pos || typeof pos.count !== "number") return

            // Work in world space; include only front-facing triangles (approx) to reduce overlapping shapes.
            const idx = geo.index
            const triCount = idx ? Math.floor(idx.count / 3) : Math.floor(pos.count / 3)
            if (!triCount) return

            const triStep = Math.max(1, Math.ceil(triCount / 4000))

            const a = new THREE.Vector3()
            const b = new THREE.Vector3()
            const c = new THREE.Vector3()
            const ab = new THREE.Vector3()
            const ac = new THREE.Vector3()
            const n = new THREE.Vector3()
            const center = new THREE.Vector3()
            const camDir = new THREE.Vector3()
            const v2 = new THREE.Vector3()

            for (let t = 0; t < triCount; t += triStep) {
              const i0 = idx ? idx.getX(t * 3 + 0) : t * 3 + 0
              const i1 = idx ? idx.getX(t * 3 + 1) : t * 3 + 1
              const i2 = idx ? idx.getX(t * 3 + 2) : t * 3 + 2

              a.fromBufferAttribute(pos, i0).applyMatrix4(desc.matrixWorld)
              b.fromBufferAttribute(pos, i1).applyMatrix4(desc.matrixWorld)
              c.fromBufferAttribute(pos, i2).applyMatrix4(desc.matrixWorld)

              // face normal in world space
              ab.copy(b).sub(a)
              ac.copy(c).sub(a)
              n.copy(ab).cross(ac)
              const len = n.length()
              if (len < 1e-8) continue
              n.multiplyScalar(1 / len)

              center.copy(a).add(b).add(c).multiplyScalar(1 / 3)
              camDir.copy(plainCamera.position).sub(center).normalize()

              // Ignore top and bottom faces (normals mostly along Y axis)
              if (Math.abs(n.y) > 0.85) continue

              // Use abs(dot) because many OBJ exports have inconsistent winding.
              // Skip faces that are close to edge-on to camera (they add noise and cause skinny hulls).
              const facing = Math.abs(n.dot(camDir))
              if (facing < 0.25) continue

              // add projected vertices for hull
              const verts = [a, b, c]
              for (const vv of verts) {
                v2.copy(vv).project(plainCamera)
                if (v2.z < -1 || v2.z > 1) continue
                const x = (v2.x * 0.5 + 0.5) * w
                const y = (-v2.y * 0.5 + 0.5) * h
                if (!Number.isFinite(x) || !Number.isFinite(y)) continue
                pts.push({ x, y })
              }
            }
          })
        }

        return pts
      }

      updateLayerButtonsPositions = () => {
        if (!layerButtonEntries.length) return
        const w = plainRenderer.domElement.clientWidth || plainRenderer.domElement.width
        const h = plainRenderer.domElement.clientHeight || plainRenderer.domElement.height
        if (!w || !h) return

        layerShapesSvg.setAttribute("width", String(w))
        layerShapesSvg.setAttribute("height", String(h))
        layerShapesSvg.setAttribute("viewBox", `0 0 ${w} ${h}`)

        for (const entry of layerButtonEntries) {
          const { nodes, path } = entry

          const pts = projectLayerPoints(nodes, w, h)
          if (pts.length < 3) {
            path.setAttribute("d", "")
            path.style.display = "none"
            continue
          }

          const hull = convexHull(pts)
          const d = pathFromHull(hull)
          path.setAttribute("d", d)

          // If hull is on-screen, show it; otherwise hide to reduce clutter.
          path.style.display = "block"
        }
      }

      obj.traverse((child) => {
        if (child && child.isMesh) {
          child.castShadow = false
          child.receiveShadow = false
          if (!child.material) child.material = new THREE.MeshStandardMaterial({ color: 0xcccccc })
        }
      })

      // Apply colors: match by object/group name. If a group matches, color all descendant meshes.
      // This assumes your OBJ contains group/object names like "kondygnacja_01" etc.
      if (layerToColor.size > 0) {
        obj.traverse((node) => {
          const nName = normalizeName(node.name)
          if (!nName) return

          for (const [layerName, hex] of layerToColor.entries()) {
            // exact match or contains (to handle prefixes/suffixes)
            if (nName === layerName || nName.includes(layerName)) {
              node.traverse((desc) => {
                if (desc && desc.isMesh) applyColorToMesh(desc, hex)
              })
            }
          }
        })
      }

      createLayerButtons(obj)

      plainScene.add(obj)

      const box = new THREE.Box3().setFromObject(obj)
      const size = box.getSize(new THREE.Vector3())
      const center = box.getCenter(new THREE.Vector3())

      const maxDim = Math.max(size.x, size.y, size.z) || 1
      const fov = plainCamera.fov * (Math.PI / 180)
      const dist = (maxDim / 2) / Math.tan(fov / 2)

      plainTarget = center
      plainBaseOffset = new THREE.Vector3(dist * 1.2, dist * 0.7, dist * 1.2)
      setPlainAngle(0)
      plainCamera.near = Math.max(0.1, dist / 100)
      plainCamera.far = Math.max(5000, dist * 10)
      plainCamera.updateProjectionMatrix()
    }

    loadObjForPlainViewer().catch((e) => {
      plainContainer.textContent = "Nie udało się wczytać modelu: " + (e?.message || e)
    })

    function animatePlain() {
      requestAnimationFrame(animatePlain)
      updateLayerButtonsPositions()
      plainRenderer.render(plainScene, plainCamera)
    }
    animatePlain()
  </script>
</body>
</html>
