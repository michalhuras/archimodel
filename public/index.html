<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Project</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <h1>Private content</h1>
  <p>This page is protected.</p>

  <h2>Apartments</h2>
  <div id="apartments">Loading...</div>

  <h2>3D model</h2>
  <div id="model-viewer" style="width: 100%; max-width: 1100px; height: 520px; border: 1px solid #ddd;"></div>

  <button onclick="logout()">Logout</button>

  <script>
    if (localStorage.getItem("auth") !== "ok") {
      window.location.href = "/login.html"
    }

    async function loadApartments() {
      const el = document.getElementById("apartments")

      try {
        const res = await fetch("/.netlify/functions/apartment")
        if (!res.ok) throw new Error("Request failed")
        const apartments = await res.json()

        if (!Array.isArray(apartments) || apartments.length === 0) {
          el.textContent = "No apartments"
          return
        }

        const table = document.createElement("table")
        const header = document.createElement("tr")
        header.innerHTML = "<th>Name</th><th>Value</th><th>Area</th><th>State</th>"
        table.appendChild(header)

        for (const a of apartments) {
          const row = document.createElement("tr")
          row.innerHTML = `<td>${a.name ?? ""}</td><td>${a.value ?? ""}</td><td>${a.area ?? ""}</td><td>${a.state ?? ""}</td>`
          table.appendChild(row)
        }

        el.textContent = ""
        el.appendChild(table)
      } catch (e) {
        el.textContent = "Failed to load apartments"
      }
    }

    function logout() {
      localStorage.removeItem("auth")
      window.location.href = "/login.html"
    }

    loadApartments()
  </script>

  <script type="module">
    import * as THREE from "three"
    import { OrbitControls } from "three/addons/controls/OrbitControls.js"
    import { OBJLoader } from "three/addons/loaders/OBJLoader.js"

    const container = document.getElementById("model-viewer")
    if (!container) throw new Error("Missing #model-viewer")

    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0xf7f7f7)

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000)
    camera.position.set(3, 2, 3)

    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setPixelRatio(window.devicePixelRatio || 1)
    container.appendChild(renderer.domElement)

    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true

    scene.add(new THREE.AmbientLight(0xffffff, 0.7))
    const dir = new THREE.DirectionalLight(0xffffff, 0.7)
    dir.position.set(5, 10, 7)
    scene.add(dir)

    scene.add(new THREE.GridHelper(10, 10, 0x999999, 0xdddddd))
    scene.add(new THREE.AxesHelper(2))

    function resize() {
      const w = container.clientWidth || 800
      const h = container.clientHeight || 500
      renderer.setSize(w, h, false)
      camera.aspect = w / h
      camera.updateProjectionMatrix()
    }
    window.addEventListener("resize", resize)
    resize()

    async function loadObjFromEndpoint() {
      const res = await fetch("/.netlify/functions/model-obj")
      if (!res.ok) throw new Error("OBJ endpoint failed")
      const objText = await res.text()

      const loader = new OBJLoader()
      const obj = loader.parse(objText)

      obj.traverse((child) => {
        if (child && child.isMesh) {
          child.castShadow = false
          child.receiveShadow = false
          if (!child.material) child.material = new THREE.MeshStandardMaterial({ color: 0xcccccc })
        }
      })

      scene.add(obj)

      const box = new THREE.Box3().setFromObject(obj)
      const size = box.getSize(new THREE.Vector3())
      const center = box.getCenter(new THREE.Vector3())

      controls.target.copy(center)

      const maxDim = Math.max(size.x, size.y, size.z) || 1
      const fov = camera.fov * (Math.PI / 180)
      const dist = (maxDim / 2) / Math.tan(fov / 2)

      camera.position.copy(center).add(new THREE.Vector3(dist * 1.2, dist * 0.7, dist * 1.2))
      camera.near = Math.max(0.1, dist / 100)
      camera.far = Math.max(5000, dist * 10)
      camera.updateProjectionMatrix()

      controls.update()
    }

    loadObjFromEndpoint().catch((e) => {
      container.textContent = "Nie udało się wczytać modelu: " + (e?.message || e)
    })

    function animate() {
      requestAnimationFrame(animate)
      controls.update()
      renderer.render(scene, camera)
    }
    animate()
  </script>
</body>
</html>
