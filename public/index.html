<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Project</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://unpkg.com/fflate@0.8.2/umd/index.js"></script>
</head>
<body>
  <h1>Private content</h1>
  <p>This page is protected.</p>

  <h2>Apartments</h2>
  <div id="apartments">Loading...</div>

  <h2>Renders</h2>
  <div id="renders" style="width: 100%; max-width: 1100px; border: 1px solid #ddd; padding: 10px 12px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
      <button id="renders-load" type="button">Load renders ZIP</button>
      <button id="renders-prev" type="button" disabled>&larr; Prev</button>
      <button id="renders-next" type="button" disabled>Next &rarr;</button>
      <button id="renders-play" type="button" disabled>Play</button>
      <div id="renders-status" style="font-size: 12px; color: #374151;"></div>
    </div>
    <div style="margin-top: 10px; width: 100%; height: 520px; background: #f7f7f7; border: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: center; overflow: hidden;">
      <img id="renders-img" alt="render" style="max-width: 100%; max-height: 100%; object-fit: contain; display: none;" />
      <div id="renders-empty" style="color: #6b7280;">No renders loaded</div>
    </div>
  </div>

  <h2>3D model</h2>
  <div id="model-viewer" style="width: 100%; max-width: 1100px; height: 520px; border: 1px solid #ddd; position: relative; overflow: hidden;"></div>

  <div id="plain-angle-controls" style="width: 100%; max-width: 1100px; border: 1px solid #ddd; border-top: 0; padding: 10px 12px; box-sizing: border-box; display: flex; align-items: center; gap: 12px;">
    <button id="plain-angle-left" type="button">&larr;</button>
    <div style="min-width: 90px; text-align: center; font-weight: 600;" id="plain-angle-value">0°</div>
    <button id="plain-angle-right" type="button">&rarr;</button>
  </div>

  <button onclick="logout()">Logout</button>

  <script>
    if (localStorage.getItem("auth") !== "ok") {
      window.location.href = "/login.html"
    }

    function normalizeLayerName(s) {
      return String(s || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "_")
    }

    window.__highlightApartmentsByLayer = function (layerName) {
      const key = normalizeLayerName(layerName)
      const rows = document.querySelectorAll("#apartments table tr[data-layer]")
      for (const r of rows) {
        const match = key && r.dataset.layer === key
        r.style.background = match ? "rgba(99, 102, 241, 0.18)" : ""
        r.style.outline = match ? "2px solid rgba(99, 102, 241, 0.45)" : ""
      }
    }

    async function loadApartments() {
      const el = document.getElementById("apartments")

      try {
        const res = await fetch("/.netlify/functions/apartment")
        if (!res.ok) throw new Error("Request failed")
        const apartments = await res.json()

        if (!Array.isArray(apartments) || apartments.length === 0) {
          el.textContent = "No apartments"
          return
        }

        const table = document.createElement("table")
        const header = document.createElement("tr")
        header.innerHTML = "<th>Name</th><th>Price</th><th>Price/m²</th><th>Area</th><th>Floor</th><th>State</th><th>Layer</th>"
        table.appendChild(header)

        for (const a of apartments) {
          const row = document.createElement("tr")
          const layer = normalizeLayerName(a.layer_name)
          if (layer) row.dataset.layer = layer

          row.innerHTML = `<td>${a.name ?? ""}</td><td>${a.price ?? ""}</td><td>${a.price_per_square_metre ?? ""}</td><td>${a.area ?? ""}</td><td>${a.floor ?? ""}</td><td>${a.state ?? ""}</td><td>${a.layer_name ?? ""}</td>`
          table.appendChild(row)
        }

        el.textContent = ""
        el.appendChild(table)
      } catch (e) {
        el.textContent = "Failed to load apartments"
      }
    }

    function logout() {
      localStorage.removeItem("auth")
      window.location.href = "/login.html"
    }

    loadApartments()

    ;(() => {
      const ZIP_BASE_URL = "https://pub-bd8c5d894c334dbfa30341d1d4208c04.r2.dev"
      const ZIP_FILE_NAME = "render_webp.zip"
      const ZIP_URL = "/.netlify/functions/renders-zip"

      const loadBtn = document.getElementById("renders-load")
      const prevBtn = document.getElementById("renders-prev")
      const nextBtn = document.getElementById("renders-next")
      const playBtn = document.getElementById("renders-play")
      const statusEl = document.getElementById("renders-status")
      const imgEl = document.getElementById("renders-img")
      const emptyEl = document.getElementById("renders-empty")

      if (!loadBtn || !prevBtn || !nextBtn || !playBtn || !statusEl || !imgEl || !emptyEl) return

      let entries = []
      let idx = 0
      let currentUrl = null
      let playTimer = null
      const urlCache = new Map()

      function setStatus(msg) {
        statusEl.textContent = msg || ""
      }

      function isImageName(name) {
        return /\.(webp|png|jpe?g|gif)$/i.test(String(name || ""))
      }

      function makeUrl(name, bytes) {
        const cached = urlCache.get(name)
        if (cached) return cached

        const lower = String(name).toLowerCase()
        let type = "application/octet-stream"
        if (lower.endsWith(".webp")) type = "image/webp"
        else if (lower.endsWith(".png")) type = "image/png"
        else if (lower.endsWith(".jpg") || lower.endsWith(".jpeg")) type = "image/jpeg"
        else if (lower.endsWith(".gif")) type = "image/gif"

        const blob = new Blob([bytes], { type })
        const url = URL.createObjectURL(blob)
        urlCache.set(name, url)
        return url
      }

      function cleanupUrls(keepNames) {
        const keep = new Set(keepNames)
        for (const [name, url] of urlCache.entries()) {
          if (!keep.has(name)) {
            URL.revokeObjectURL(url)
            urlCache.delete(name)
          }
        }
      }

      function updateControls() {
        const has = entries.length > 0
        prevBtn.disabled = !has
        nextBtn.disabled = !has
        playBtn.disabled = !has
        playBtn.textContent = playTimer ? "Pause" : "Play"
      }

      function show(i) {
        if (!entries.length) return
        idx = ((i % entries.length) + entries.length) % entries.length
        const e = entries[idx]

        const url = makeUrl(e.name, e.bytes)
        if (currentUrl && currentUrl !== url) {
          // keep cached urls; cleanup later
        }
        currentUrl = url

        imgEl.src = url
        imgEl.style.display = "block"
        emptyEl.style.display = "none"
        setStatus(`${idx + 1}/${entries.length} - ${e.name}`)

        const keep = [e.name]
        const prev = entries[(idx - 1 + entries.length) % entries.length]?.name
        const next = entries[(idx + 1) % entries.length]?.name
        if (prev) keep.push(prev)
        if (next) keep.push(next)
        cleanupUrls(keep)

        updateControls()
      }

      function togglePlay() {
        if (!entries.length) return
        if (playTimer) {
          clearInterval(playTimer)
          playTimer = null
          updateControls()
          return
        }
        playTimer = setInterval(() => {
          show(idx + 1)
        }, 800)
        updateControls()
      }

      prevBtn.onclick = () => show(idx - 1)
      nextBtn.onclick = () => show(idx + 1)
      playBtn.onclick = () => togglePlay()

      loadBtn.onclick = async () => {
        try {
          loadBtn.disabled = true
          if (playTimer) {
            clearInterval(playTimer)
            playTimer = null
          }
          entries = []
          idx = 0
          imgEl.style.display = "none"
          emptyEl.style.display = "block"
          emptyEl.textContent = "Loading ZIP..."
          setStatus(`Downloading: ${ZIP_FILE_NAME}`)
          updateControls()

          const res = await fetch(ZIP_URL, { mode: "cors" })
          if (!res.ok) throw new Error(`ZIP download failed (${res.status})`)

          const buf = await res.arrayBuffer()
          const u8 = new Uint8Array(buf)

          if (!window.fflate?.unzipSync) {
            throw new Error("ZIP library not loaded")
          }

          setStatus("Unzipping...")
          const files = window.fflate.unzipSync(u8)

          const list = []
          for (const [name, bytes] of Object.entries(files)) {
            if (!isImageName(name)) continue
            list.push({ name, bytes })
          }

          list.sort((a, b) => a.name.localeCompare(b.name))

          entries = list
          if (!entries.length) {
            emptyEl.textContent = "ZIP loaded, but no images found"
            setStatus("No images in ZIP")
            updateControls()
            return
          }

          emptyEl.textContent = ""
          show(0)
        } catch (e) {
          emptyEl.style.display = "block"
          emptyEl.textContent = "Failed to load ZIP"
          const msg = String(e?.message || e)
          const hint =
            msg.includes("Failed to fetch") || msg.includes("CORS")
              ? "Hint: if this is a CORS error, ensure the R2 public URL is accessible from browsers and the object exists: " + ZIP_URL
              : ""
          setStatus([msg, hint].filter(Boolean).join(" | "))
          updateControls()
        } finally {
          loadBtn.disabled = false
        }
      }

      // Auto-load ZIP on page load
      setTimeout(() => {
        try {
          loadBtn.click()
        } catch {
          // ignore
        }
      }, 0)
    })()
  </script>

  <script>
    // --- Overlay-only viewer (no OBJ / no Three.js) ---
    const viewerEl = document.getElementById("model-viewer")
    if (!viewerEl) throw new Error("Missing #model-viewer")
    viewerEl.style.background = "#f7f7f7"

    const overlayRoot = document.createElement("div")
    overlayRoot.style.position = "absolute"
    overlayRoot.style.left = "0"
    overlayRoot.style.top = "0"
    overlayRoot.style.width = "100%"
    overlayRoot.style.height = "100%"
    overlayRoot.style.pointerEvents = "none"
    viewerEl.appendChild(overlayRoot)

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg")
    svg.setAttribute("width", "100%")
    svg.setAttribute("height", "100%")
    svg.setAttribute("preserveAspectRatio", "none")
    svg.style.position = "absolute"
    svg.style.left = "0"
    svg.style.top = "0"
    svg.style.pointerEvents = "none"
    overlayRoot.appendChild(svg)

    const leftBtn = document.getElementById("plain-angle-left")
    const rightBtn = document.getElementById("plain-angle-right")
    const angleValueEl = document.getElementById("plain-angle-value")

    function normalizeName(s) {
      return String(s || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "_")
    }

    function colorForState(state) {
      const st = String(state || "").toLowerCase()
      if (st === "selling") return "#86efac" // pastel green
      if (st === "sold") return "#fca5a5" // pastel red
      if (st === "reserved") return "#fdba74" // pastel orange
      return "#93c5fd" // pastel blue fallback
    }

    async function fetchJson(url) {
      const res = await fetch(url)
      if (!res.ok) throw new Error(`Request failed: ${url}`)
      return await res.json()
    }

    let overlaysData = null
    let layerToColor = new Map()
    let currentAngleDeg = 0
    let stepDeg = 5
    let selectedLayer = null
    const pathsByLayer = new Map()

    function normalizeAngleToStep(deg) {
      const n = ((deg % 360) + 360) % 360
      const snapped = Math.round(n / stepDeg) * stepDeg
      return ((snapped % 360) + 360) % 360
    }

    function ensureViewBox() {
      if (!overlaysData) return
      const w = overlaysData.width || 1100
      const h = overlaysData.height || 520
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`)
    }

    function renderAngle(deg) {
      if (!overlaysData) return
      currentAngleDeg = normalizeAngleToStep(deg)
      if (angleValueEl) angleValueEl.textContent = `${currentAngleDeg}°`

      ensureViewBox()

      const angleKey = String(currentAngleDeg)
      const perLayer = overlaysData.angles?.[angleKey] || {}

      // hide all existing paths first
      for (const [, p] of pathsByLayer.entries()) {
        p.style.display = "none"
      }

      for (const [layerName, col] of layerToColor.entries()) {
        const shape = perLayer[layerName]
        if (!shape || !shape.d) continue

        let pathEl = pathsByLayer.get(layerName)
        if (!pathEl) {
          pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path")
          pathEl.style.cursor = "pointer"
          pathEl.style.pointerEvents = "auto"

          pathEl.addEventListener("click", () => {
            selectedLayer = layerName
            if (typeof window.__highlightApartmentsByLayer === "function") {
              window.__highlightApartmentsByLayer(layerName)
            }
            renderAngle(currentAngleDeg)
          })

          svg.appendChild(pathEl)
          pathsByLayer.set(layerName, pathEl)
        }

        pathEl.setAttribute("d", shape.d)
        pathEl.setAttribute("fill", col)
        pathEl.setAttribute("fill-opacity", "0.55")
        pathEl.setAttribute("stroke", col)
        pathEl.setAttribute("stroke-opacity", "0.9")
        pathEl.setAttribute("stroke-width", selectedLayer === layerName ? "4" : "2")
        pathEl.style.display = "block"
      }
    }

    async function initOverlayViewer() {
      const [overlays, apartments] = await Promise.all([
        fetchJson("/.netlify/functions/layer-overlays"),
        fetchJson("/.netlify/functions/apartment").catch(() => [])
      ])

      overlaysData = overlays
      stepDeg = Number(overlaysData.stepDeg) || 5

      const tmp = new Map()
      for (const a of Array.isArray(apartments) ? apartments : []) {
        const layer = normalizeName(a.layer_name)
        if (!layer) continue
        if (!tmp.has(layer)) tmp.set(layer, colorForState(a.state))
      }
      layerToColor = tmp

      // If apartments list is empty, fall back to whatever exists at angle 0
      if (layerToColor.size === 0) {
        const perLayer0 = overlaysData.angles?.["0"] || {}
        for (const layer of Object.keys(perLayer0)) {
          layerToColor.set(layer, "#93c5fd")
        }
      }

      renderAngle(0)

      if (leftBtn) leftBtn.onclick = () => renderAngle(currentAngleDeg - stepDeg)
      if (rightBtn) rightBtn.onclick = () => renderAngle(currentAngleDeg + stepDeg)
    }

    initOverlayViewer().catch((e) => {
      viewerEl.textContent = "Nie udało się wczytać danych overlay: " + (e?.message || e)
    })
  </script>
</body>
</html>
