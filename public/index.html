<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Project</title>
</head>
<body>
  <h1>Private content</h1>
  <p>This page is protected.</p>

  <button onclick="logout()">Logout</button>

  <script>
    if (localStorage.getItem("auth") !== "ok") {
      window.location.href = "/login.html"
    }

    function logout() {
      localStorage.removeItem("auth")
      window.location.href = "/login.html"
    }
  </script>
</body>
</html>
