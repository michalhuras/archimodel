<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Archmodel</title>
  <script src="https://unpkg.com/fflate@0.8.2/umd/index.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/spritespin@4.0.11/release/spritespin.css" />
  <script src="https://unpkg.com/spritespin@4.0.11/release/spritespin.js"></script>
</head>
<body>
  <div style="max-width: 1400px; margin: 0 auto; padding: 20px;">
    <div style="display: flex; gap: 20px; border: 1px solid #ddd; padding: 20px; box-sizing: border-box; flex-wrap: wrap;">
      
      <!-- Left side: 3D Model -->
      <div id="renders" style="flex: 1; min-width: 400px;">
        <div id="spritespin-wrapper" style="position: relative; width: 100%; max-width: 520px; margin: 0 auto;">
          <div id="spritespin-viewer" style="width: 100%; aspect-ratio: 1 / 1; background: #f7f7f7; border: 1px solid #e5e7eb;"></div>
          <img src="/.netlify/functions/logo" alt="Logo" style="position: absolute; top: 10px; left: 10px; width: 60px; height: auto; z-index: 100; pointer-events: none; opacity: 0.85;" />
          <button id="spritespin-toggle-layers" type="button" disabled style="position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; padding: 8px; background: rgba(255,255,255,0.8); border: 1px solid #e5e7eb; border-radius: 8px; cursor: pointer; z-index: 100; display: flex; align-items: center; justify-content: center;">
            <img src="/assets/icons/hide.svg" alt="layers" style="width: 12px; height: 12px;" />
          </button>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
          <div id="renders-status" style="font-size: 12px; color: #374151;"></div>
        </div>
      </div>

      <!-- Right side: Apartments table -->
      <div style="flex: 1; min-width: 300px;">
        <div id="apartments">Loading...</div>
      </div>

    </div>
  </div>

  <button onclick="logout()" style="margin: 20px;">Logout</button>

  <footer style="margin-top: 40px; padding: 20px 0; text-align: center; font-size: 11px; color: #6b7280;">
    <div>v<span class="app-version">...</span></div>
  </footer>

</body>
</html>
