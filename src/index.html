<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archmodel</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://unpkg.com/fflate@0.8.2/umd/index.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/spritespin@4.0.11/release/spritespin.css" />
  <script src="https://unpkg.com/spritespin@4.0.11/release/spritespin.js"></script>
</head>
<body class="app-page">
  <div class="app-shell">
    <main class="app-main">
        <div class="app-viewer-inner" id="renders">
          <div id="spritespin-wrapper" style="position: relative; width: 100%; margin: 0 auto;">
            <div id="spritespin-viewer"></div>

            <img
              src="/.netlify/functions/logo"
              data-i18n-alt="app.logoAlt"
              alt="Logo"
              style="position: absolute; top: 10px; left: 10px; width: 60px; height: auto; z-index: 100; pointer-events: none; opacity: 0.85;"
            />

            <div
              style="position: absolute; top: 10px; right: 42px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: solid transparent; z-index: 100;"
            >
              <img
                id="spritespin-compass"
                src="/assets/icons/compass.svg"
                data-i18n-alt="renders.compassAlt"
                alt="compass"
                style="width: 15px; height: 15px;"
              />
            </div>

            <button
              id="spritespin-toggle-layers"
              type="button"
              disabled
              style="position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; padding: 0; border: 1px solid #64748b; cursor: pointer; z-index: 100; display: flex; align-items: center; justify-content: center;"
            >
              <img
                src="/assets/icons/hide.svg"
                data-i18n-alt="renders.layersAlt"
                alt="layers"
                style="width: 15px; height: 15px;"
              />
            </button>


          </div>
        </div>

        <div id="apartments" data-i18n="apartments.loading">Loading...</div>
    </main>

    <footer class="app-footer">
      v<span class="app-version">...</span>
    </footer>
  </div>
</body>
</html>
