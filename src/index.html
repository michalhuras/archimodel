<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archmodel</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://unpkg.com/fflate@0.8.2/umd/index.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/spritespin@4.0.11/release/spritespin.css" />
  <script src="https://unpkg.com/spritespin@4.0.11/release/spritespin.js"></script>
</head>
<body class="app-page">
  <div class="app-shell">
    <main class="app-main">
        <section class="app-viewer-panel" id="renders">
          <div id="spritespin-wrapper" class="spritespin-wrapper">
            <div class="spritespin-stage">
              <div id="spritespin-viewer"></div>
              <img
                class="spritespin-logo"
                src="/.netlify/functions/logo"
                data-i18n-alt="app.logoAlt"
                alt="Logo"
              />

              <div class="spritespin-compass-badge">
                <img
                  id="spritespin-compass"
                  src="/assets/icons/compass.svg"
                  data-i18n-alt="renders.compassAlt"
                  alt="compass"
                />
              </div>

              <button
                id="spritespin-toggle-layers"
                type="button"
                disabled
              >
                <img
                  src="/assets/icons/hide.svg"
                  data-i18n-alt="renders.layersAlt"
                  alt="layers"
                />
              </button>
            </div>
          </div>
        </section>

        <section id="apartments" class="app-table-panel" data-i18n="apartments.loading">Loading...</section>
    </main>

    <footer class="app-footer">
      <div>Copyright (c) 2026 M. H. All rights reserved.</div>
      <div>v<span class="app-version">...</span></div>
    </footer>
  </div>
</body>
</html>
