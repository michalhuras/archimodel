[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm run build"

[functions]
  included_files = [
    "netlify/functions/apartments.json",
    "netlify/functions/layer-overlays.json"
  ]

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/login"
  status = 200
